<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOV → MP4 Converter</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>MOV → MP4 Converter</h1>
      <p class="sub">Drop iPhone <code>.mov</code> files below. HDR clips are tone-mapped to
        SDR so they look right in your editor; already-compatible clips are remuxed losslessly.</p>
    </header>

    <div id="dropzone" tabindex="0" role="button" aria-label="Add .mov files">
      <div class="dz-inner">
        <div class="dz-icon">⤓</div>
        <p><strong>Drop .mov files here</strong></p>
        <p class="dz-hint">or click to browse</p>
      </div>
      <input id="fileInput" type="file" accept=".mov,video/quicktime" multiple hidden />
    </div>

    <div class="controls">
      <label class="field">
        <span>Save converted files to</span>
        <input id="outdir" type="text" value="~/Downloads" spellcheck="false" />
      </label>
      <button id="convertBtn" disabled>Convert</button>
    </div>

    <ul id="fileList" class="file-list"></ul>
  </main>

  <template id="rowTemplate">
    <li class="file-row">
      <div class="row-main">
        <span class="row-name"></span>
        <span class="row-status">ready</span>
      </div>
      <div class="bar"><div class="bar-fill"></div></div>
      <div class="row-detail"></div>
    </li>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
